name: CRM Build Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROWTHOPS_SUPABASE_SECRET_KEY: ''
      GROWTHOPS_SUPABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Toolchain versions
        run: |
          node --version
          python3 --version
      - name: Diagnose Preview secret guard
        run: python3 preview_secret_guard.py
      - name: Diagnose CI quota guard
        run: python3 test_ci_quota_guard.py
      - name: Diagnose full-schema recovery guard
        run: python3 test_full_schema_export_recovery.py
      - name: Diagnose migration-ledger recovery guard
        run: python3 test_migration_ledger_recovery.py
      - name: Diagnose canonical source integrity
        run: python3 verify_final_source.py
      - name: Diagnose runtime config compatibility
        run: python3 runtime_config_compat.py
      - name: Run canonical CRM build gates
        run: sh build.sh && python3 cloudflare_p1_verify.py
