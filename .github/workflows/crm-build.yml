name: CRM Build Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROWTHOPS_SUPABASE_SECRET_KEY: ''
      GROWTHOPS_SUPABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Preview secret guard
        run: python3 preview_secret_guard.py
      - name: CI quota guard
        run: python3 test_ci_quota_guard.py
      - name: Full-schema recovery guard
        run: python3 test_full_schema_export_recovery.py
      - name: Migration-ledger recovery guard
        run: python3 test_migration_ledger_recovery.py
      - name: Canonical source integrity
        run: python3 verify_final_source.py
      - name: Runtime config compatibility
        run: python3 runtime_config_compat.py
      - name: Build final
        run: python3 build_final.py
      - name: P2 finalize
        run: python3 p2_finalize.py
      - name: P2 output test
        run: python3 test_p2_output.py
      - name: Security finalize
        run: python3 security_finalize.py
      - name: Backup security finalize
        run: python3 backup_security_finalize.py
      - name: Security reveal UI finalize
        run: python3 security_reveal_ui_finalize.py
      - name: Credential template finalize
        run: python3 credential_template_initial_finalize.py
      - name: Credential status UI finalize
        run: python3 credential_status_ui_finalize.py
      - name: Account asset context finalize
        run: python3 account_asset_client_context_finalize.py
      - name: Assets all clients finalize
        run: python3 assets_all_clients_finalize.py
      - name: Credential status loading finalize
        run: python3 credential_status_loading_finalize.py
      - name: Account asset typography finalize
        run: python3 account_asset_value_typography_finalize.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROWTHOPS_SUPABASE_SECRET_KEY: ''
      GROWTHOPS_SUPABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Toolchain versions
        run: |
          node --version
          python3 --version
      - name: Run canonical CRM build gates
        run: sh build.sh && python3 cloudflare_p1_verify.py
