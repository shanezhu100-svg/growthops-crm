name: CRM Build Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROWTHOPS_SUPABASE_SECRET_KEY: ''
      GROWTHOPS_SUPABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Preview secret guard
        run: python3 preview_secret_guard.py
      - name: CI quota guard
        run: python3 test_ci_quota_guard.py
      - name: Full-schema recovery guard
        run: python3 test_full_schema_export_recovery.py
      - name: Migration-ledger recovery guard
        run: python3 test_migration_ledger_recovery.py
      - name: Canonical source integrity
        run: python3 verify_final_source.py
      - name: Runtime config compatibility
        run: python3 runtime_config_compat.py
      - name: Build final
        run: python3 build_final.py
      - name: P2 finalize
        run: python3 p2_finalize.py
      - name: P2 output test
        run: python3 test_p2_output.py
      - name: Security finalize
        run: python3 security_finalize.py
      - name: Backup security finalize
        run: python3 backup_security_finalize.py
      - name: Security reveal UI finalize
        run: python3 security_reveal_ui_finalize.py
      - name: Credential template finalize
        run: python3 credential_template_initial_finalize.py
      - name: Credential status UI finalize
        run: python3 credential_status_ui_finalize.py
      - name: Account asset context finalize
        run: python3 account_asset_client_context_finalize.py
      - name: Assets all clients finalize
        run: python3 assets_all_clients_finalize.py
      - name: Credential status loading finalize
        run: python3 credential_status_loading_finalize.py
      - name: Account asset typography finalize
        run: python3 account_asset_value_typography_finalize.py
      - name: Credential status UI output test
        run: python3 test_credential_status_ui_output.py
      - name: Account asset context output test
        run: python3 test_account_asset_client_context_output.py
      - name: Credential status loading output test
        run: python3 test_credential_status_loading_output.py
      - name: Account asset typography output test
        run: python3 test_account_asset_value_typography_output.py
      - name: Account login identifier v2 finalize
        run: python3 account_login_identifier_v2_finalize.py
      - name: Credential secure reveal finalize
        run: python3 credential_secure_reveal_finalize.py
      - name: Security hotfix output test
        run: python3 test_security_hotfix_output.py
      - name: Security reveal UI output test
        run: python3 test_security_reveal_ui_output.py
      - name: Credential template output test
        run: python3 test_credential_template_initial_output.py
      - name: Account login identifier output test
        run: python3 test_account_login_identifier_output.py
      - name: Credential unlock v4 output test
        run: python3 test_credential_unlock_v4_output.py
      - name: Credential client detail v4 finalize
        run: python3 credential_client_detail_v4_finalize.py
      - name: Credential client detail v4 output test
        run: python3 test_credential_client_detail_v4_output.py
      - name: Assets all clients output test
        run: python3 test_assets_all_clients_output.py
      - name: Workspace state secret hard guard
        run: python3 test_workspace_state_secret_hard_guard.py
      - name: Backup security output test
        run: python3 test_backup_security_output.py
      - name: Preview secret output test
        run: python3 test_preview_secret_guard.py
      - name: Post-P5 v5 direct scalar test
        run: python3 test_post_p5_v5_direct_scalar.py
      - name: Vercel security headers test
        run: python3 test_vercel_security_headers.py
      - name: Cloudflare headers finalize
        run: python3 cloudflare_headers_finalize.py
      - name: Cloudflare fail-closed 404 finalize
        run: python3 cloudflare_failopen_404_finalize.py
      - name: Cloudflare fail-closed 404 test
        run: python3 test_cloudflare_failopen_404.py
      - name: Cloudflare P1 verify guard test
        run: python3 test_cloudflare_p1_verify_guard.py
      - name: Cloudflare function security headers test
        run: node test_cloudflare_function_security_headers.mjs
      - name: RPC surface hardening test
        run: python3 test_rpc_surface_hardening.py
      - name: Session security migrations test
        run: python3 test_session_security_migrations.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROWTHOPS_SUPABASE_SECRET_KEY: ''
      GROWTHOPS_SUPABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Toolchain versions
        run: |
          node --version
          python3 --version
      - name: Run canonical CRM build gates
        run: sh build.sh && python3 cloudflare_p1_verify.py
