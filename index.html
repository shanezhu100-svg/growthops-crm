<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GrowthOps CRM</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f8fc;color:#0f172a}
    .boot{height:100%;display:grid;place-items:center}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px 34px;box-shadow:0 12px 40px rgba(15,23,42,.08);text-align:center}.spin{width:30px;height:30px;border:3px solid #e2e8f0;border-top-color:#10b981;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.muted{font-size:12px;color:#94a3b8;margin-top:6px}
  </style>
</head>
<body>
  <div class="boot"><div class="card"><div class="spin"></div><strong>GrowthOps CRM 正在加载</strong><div class="muted">首次打开会读取应用资源，请稍候。</div></div></div>
  <script>
  (async()=>{
    const parts=[
      'app/part-001.txt','app/part-002.txt','app/part-003.txt','app/part-004.txt',
      'app/part-005.txt','app/part-006.txt','app/part-007.txt'
    ];
    try{
      const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw new Error(p+' '+r.status);return r.text()}));
      const b64=texts.join('').trim();
      const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      if(!('DecompressionStream' in window))throw new Error('当前浏览器不支持 DecompressionStream');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();document.write(html);document.close();
    }catch(err){
      console.error(err);document.body.innerHTML='<div class="boot"><div class="card"><strong>应用加载失败</strong><div class="muted">请刷新页面，或使用最新版 Chrome / Edge / Safari。</div></div></div>';
    }
  })();
  </script>
</body>
</html>
