<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrowthOps CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033}button,input,select,textarea{font:inherit}.hidden{display:none!important}.center{min-height:100vh;display:grid;place-items:center;padding:24px}.auth{width:min(430px,100%);background:#fff;border:1px solid #e7eaf1;border-radius:22px;padding:30px;box-shadow:0 18px 60px rgba(29,39,66,.09)}.brand{font-size:25px;font-weight:800}.sub{color:#7b8498;font-size:13px;margin:7px 0 24px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#667085;margin-bottom:6px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dfe3eb;border-radius:10px;padding:10px 12px;background:#fff;outline:none}.field input:focus,.field textarea:focus,.search:focus{border-color:#6d7cff;box-shadow:0 0 0 3px #6d7cff18}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#eef0f6;color:#26324b}.btn.primary{background:#1f2937;color:#fff}.btn.danger{color:#b42318;background:#fff0ee}.btn.small{padding:7px 10px;font-size:12px}.error{color:#b42318;background:#fff2f0;border-radius:9px;padding:9px 11px;font-size:12px;margin-top:12px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.logo{font-size:19px;font-weight:800;padding:3px 10px 20px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#aeb7c8;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;border-top:1px solid #ffffff16;padding-top:14px;font-size:12px;color:#aeb7c8}.main{padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:24px;margin:0}.topright{display:flex;gap:9px;align-items:center}.pill{background:#fff;border:1px solid #e2e6ee;border-radius:999px;padding:7px 10px;font-size:12px;color:#596277}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric,.panel{background:#fff;border:1px solid #e5e8ef;border-radius:14px}.metric{padding:18px}.metric b{display:block;font-size:27px;margin-top:8px}.metric span{font-size:12px;color:#7b8498}.panel{padding:18px;margin-top:16px}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.panelhead h2{font-size:16px;margin:0}.actions{display:flex;gap:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#798195;font-weight:600;background:#fafbfc}th,td{padding:11px 10px;border-bottom:1px solid #eef0f4;white-space:nowrap}.empty{text-align:center;color:#9aa2b1;padding:36px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4f5fc7;font-size:11px}.modalbg{position:fixed;inset:0;background:#0f172a66;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}.modal h3{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{font-size:12px;color:#667085}.statusbar{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;box-shadow:0 10px 30px #0002}.cardlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mini{background:#fff;border:1px solid #e5e8ef;border-radius:12px;padding:14px}.mini h3{font-size:14px;margin:0 0 7px}.mini p{margin:4px 0;font-size:12px;color:#687386}@media(max-width:900px){.shell{grid-template-columns:72px 1fr}.logo{font-size:0}.logo:after{content:'GO';font-size:17px}.nav button{font-size:0;text-align:center}.nav button:after{content:attr(data-short);font-size:12px}.main{padding:20px 16px}.grid{grid-template-columns:1fr 1fr}.cardlist{grid-template-columns:1fr}.sidefoot{display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.top{align-items:flex-start;gap:10px}.topright{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body>
<div id="auth" class="center"><div class="auth"><div class="brand">GrowthOps CRM</div><div id="authSub" class="sub">正在连接云端数据库…</div><form id="loginForm" class="hidden"><div class="field"><label>用户名</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">登录</button></form><form id="setupForm" class="hidden"><div class="field"><label>初始化代码</label><input id="setupCode" type="password" required></div><div class="field"><label>管理员姓名</label><input id="setupName" required></div><div class="field"><label>管理员用户名（至少3位）</label><input id="setupUser" required minlength="3"></div><div class="field"><label>管理员密码（至少10位）</label><input id="setupPass" type="password" required minlength="10"></div><button class="btn primary" style="width:100%">创建管理员并进入系统</button></form><div id="authErr" class="error hidden"></div></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="logo">GrowthOps CRM</div><div class="nav"><button data-page="dashboard" data-short="概览">概览</button><button data-page="customers" data-short="客户">客户管理</button><button data-page="accounts" data-short="账号">账号管理</button><button data-page="contracts" data-short="合同">合同续费</button><button data-page="sops" data-short="SOP">SOP 管理</button></div><div class="sidefoot"><div id="sideUser"></div><button id="logoutBtn" class="btn small" style="margin-top:9px;width:100%">退出登录</button></div></aside><main class="main"><div class="top"><h1 id="pageTitle">概览</h1><div class="topright"><span id="cloudState" class="pill">云端已连接</span><span id="rolePill" class="pill"></span></div></div><div id="content"></div></main></div>
<div id="modalRoot"></div><div id="status" class="statusbar hidden"></div>
<script>
const SUPABASE_URL='https://avahcwyxparbcjdfglzx.supabase.co';
const API_KEY='sb_publishable_5Wkk8Bb1zh5lB1YEnvJBPg_Uvmtv62w';
const TOKEN_KEY='growthops_crm_token_v2';
let token=localStorage.getItem(TOKEN_KEY)||'';let revision=0;let user=null;let state={};let page='dashboard';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function rpc(name,body={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{'apikey':API_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});let data=null;try{data=await r.json()}catch{}if(!r.ok){const msg=data?.message||data?.hint||`请求失败 ${r.status}`;throw new Error(msg)}return data}
function toast(t){const el=$('#status');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2200)}
function authError(e){const el=$('#authErr');el.textContent=e.message||String(e);el.classList.remove('hidden')}
function normalize(){state=state&&typeof state==='object'?state:{};for(const k of ['customers','accounts','contracts','sops'])if(!Array.isArray(state[k]))state[k]=[]}
async function boot(){try{const st=await rpc('crm_public_status');if(token){try{const d=await rpc('crm_load_state',{p_token:token});enter(d);return}catch{token='';localStorage.removeItem(TOKEN_KEY)}}$('#authSub').textContent=st.initialized?'请输入管理员或成员账号登录':'首次使用，请先创建管理员';$('#loginForm').classList.toggle('hidden',!st.initialized);$('#setupForm').classList.toggle('hidden',!!st.initialized)}catch(e){authError(new Error('无法连接 Supabase：'+e.message))}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#authErr').classList.add('hidden');try{const d=await rpc('crm_login',{p_username:$('#loginUser').value,p_password:$('#loginPass').value});enter(d)}catch(err){authError(err)}};
$('#setupForm').onsubmit=async e=>{e.preventDefault();$('#authErr').classList.add('hidden');try{const d=await rpc('crm_bootstrap_admin',{p_setup_code:$('#setupCode').value,p_name:$('#setupName').value,p_username:$('#setupUser').value,p_password:$('#setupPass').value});enter(d)}catch(err){authError(err)}};
function enter(d){token=d.token||token;localStorage.setItem(TOKEN_KEY,token);user=d.user;revision=Number(d.revision||0);state=d.state||{};normalize();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#sideUser').textContent=`${user.name} · ${user.role}`;$('#rolePill').textContent=user.role;setPage('dashboard')}
async function save(){try{$('#cloudState').textContent='正在保存…';const d=await rpc('crm_save_state',{p_token:token,p_state:state,p_expected_revision:revision});revision=Number(d.revision);$('#cloudState').textContent='云端已保存';toast('已保存到 Supabase')}catch(e){$('#cloudState').textContent='保存失败';if(String(e.message).includes('CLOUD_REVISION_CONFLICT')){toast('数据已被其他成员更新，请重新登录加载最新版')}else toast('保存失败：'+e.message);throw e}}
$('#logoutBtn').onclick=async()=>{try{await rpc('crm_logout',{p_token:token})}catch{}localStorage.removeItem(TOKEN_KEY);location.reload()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const titles={dashboard:'概览',customers:'客户管理',accounts:'账号管理',contracts:'合同续费',sops:'SOP 管理'};$('#pageTitle').textContent=titles[p];render()}
function render(){normalize();if(page==='dashboard')renderDashboard();else renderList(page)}
function renderDashboard(){const active=state.customers.filter(x=>x.status==='合作中').length;const exp=state.contracts.filter(x=>{if(!x.endDate)return false;const d=(new Date(x.endDate)-new Date())/86400000;return d>=0&&d<=30}).length;$('#content').innerHTML=`<div class="grid"><div class="metric"><span>客户总数</span><b>${state.customers.length}</b></div><div class="metric"><span>合作客户</span><b>${active}</b></div><div class="metric"><span>TK / FB 账号</span><b>${state.accounts.length}</b></div><div class="metric"><span>30天内合同到期</span><b>${exp}</b></div></div><div class="panel"><div class="panelhead"><h2>近期客户</h2><button class="btn small" onclick="setPage('customers')">查看全部</button></div>${state.customers.length?`<div class="cardlist">${state.customers.slice(-6).reverse().map(x=>`<div class="mini"><h3>${esc(x.name)}</h3><p>${esc(x.contact||'未填写联系人')}</p><p><span class="badge">${esc(x.status||'潜在客户')}</span></p></div>`).join('')}</div>`:'<div class="empty">还没有客户，进入“客户管理”添加第一位客户。</div>'}</div>`}
const defs={customers:{title:'客户',cols:[['name','客户名称'],['contact','联系人'],['phone','联系方式'],['status','状态']],fields:[['name','客户名称','text'],['contact','联系人','text'],['phone','联系方式','text'],['status','客户状态','select',['潜在客户','待跟进','高意向','合作中','已流失']],['platform','投放平台','select',['TikTok','Facebook','TikTok + Facebook']],['note','备注','textarea']]},accounts:{title:'账号',cols:[['name','账号名称'],['platform','平台'],['customer','所属客户'],['status','状态']],fields:[['name','账号名称','text'],['platform','平台','select',['TikTok','Facebook']],['customer','所属客户','customer'],['bmBc','BM / BC','text'],['status','状态','select',['正常','待配置','受限','停用']],['note','备注','textarea']]},contracts:{title:'合同',cols:[['customer','客户'],['startDate','开始日期'],['endDate','到期日期'],['status','状态']],fields:[['customer','客户','customer'],['startDate','开始日期','date'],['endDate','到期日期','date'],['status','状态','select',['生效中','待续费','已续费','已到期']],['amount','合同金额','number'],['note','续费记录 / 备注','textarea']]},sops:{title:'SOP',cols:[['name','SOP名称'],['customer','客户'],['platform','平台'],['status','进度']],fields:[['name','SOP名称','text'],['customer','客户','customer'],['platform','平台','select',['TikTok','Facebook','通用']],['status','进度','select',['未开始','进行中','已完成']],['owner','负责人','text'],['note','执行说明','textarea']]}};
function renderList(k){const d=defs[k],rows=state[k];$('#content').innerHTML=`<div class="panel"><div class="panelhead"><h2>${d.title}列表</h2><div class="actions"><input class="search" id="search" placeholder="搜索${d.title}" style="width:190px"><button class="btn primary" onclick="openEdit('${k}')">+ 新增${d.title}</button></div></div><div id="tableArea"></div></div>`;$('#search').oninput=()=>renderTable(k,$('#search').value);renderTable(k,'')}
function renderTable(k,q){const d=defs[k];const rows=state[k].filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));$('#tableArea').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr>${d.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr>${d.cols.map(c=>`<td>${c[0]==='status'?`<span class="badge">${esc(x[c[0]]||'-')}</span>`:esc(x[c[0]]||'-')}</td>`).join('')}<td><button class="btn small" onclick="openEdit('${k}','${x.id}')">编辑</button> <button class="btn small danger" onclick="removeItem('${k}','${x.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无数据</div>'}
function openEdit(k,id=''){const d=defs[k],old=state[k].find(x=>x.id===id)||{};const customers=state.customers.map(x=>x.name);const fields=d.fields.map(([key,label,type,opts])=>{let input;if(type==='select')input=`<select name="${key}">${opts.map(o=>`<option ${old[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(type==='customer')input=`<select name="${key}"><option value="">请选择客户</option>${customers.map(o=>`<option ${old[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(type==='textarea')input=`<textarea name="${key}" rows="3">${esc(old[key]||'')}</textarea>`;else input=`<input name="${key}" type="${type}" value="${esc(old[key]||'')}">`;return `<div class="field ${type==='textarea'?'span2':''}"><label>${label}</label>${input}</div>`}).join('');$('#modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><form class="modal" id="editForm"><h3>${id?'编辑':'新增'}${d.title}</h3><div class="formgrid">${fields}</div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form></div>`;$('#editForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const obj={...old,id:id||crypto.randomUUID(),updatedAt:new Date().toISOString()};for(const [a,b] of fd)obj[a]=b;if(!id)obj.createdAt=new Date().toISOString();if(k==='accounts'&&!obj.customer){toast('请先选择客户');return}if(id)state[k][state[k].findIndex(x=>x.id===id)]=obj;else state[k].push(obj);closeModal();render();await save()}}
function closeModal(){$('#modalRoot').innerHTML=''}
async function removeItem(k,id){if(!confirm('确认删除这条记录？'))return;state[k]=state[k].filter(x=>x.id!==id);render();await save()}
window.setPage=setPage;window.openEdit=openEdit;window.closeModal=closeModal;window.removeItem=removeItem;boot();
</script>
</body></html>
